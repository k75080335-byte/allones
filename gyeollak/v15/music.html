<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GYEOLLAK 결락 — III 음악 · 장마의 잔향 (v15 draft)</title>
<link rel="stylesheet" href="css/v12.css">
<link rel="stylesheet" href="css/toc.css">
<style>
body{background:linear-gradient(180deg,#F7F9FC 0%,#E7EEF8 60%,#D9E4F4 100%);min-height:100vh}
.mu{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,80px);padding:110px var(--pad) 140px;max-width:1440px;margin:0 auto}
/* 왼쪽: 케이스 고정, CD만 돈다 */
.deck{position:sticky;top:96px;align-self:start;height:calc(100vh - 220px);min-height:420px;display:grid;place-items:center}
.case{position:relative;width:min(38vw,480px);aspect-ratio:1}
.case img{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 34px 44px rgba(20,40,90,.22));transition:opacity .35s}
.case img.sw{opacity:0}
.case .disc{position:absolute;z-index:1;top:7%;left:22%;width:86%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#F6F9FD 0 9%,rgba(14,24,52,.25) 9.4% 10%,transparent 10.4% 30%,rgba(255,255,255,.4) 30.5% 31%,transparent 31.5%),conic-gradient(from 20deg,#E8EDF5,#C7D3E6,#F7F9FC,#AFC1DD,#EEF2F8,#C7D3E6,#E8EDF5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 10px 24px rgba(20,40,90,.2);transition:left .7s cubic-bezier(.2,.8,.2,1)}
.mu.playing .disc{left:42%;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.deck .cap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font:500 9.5px/1 var(--mono);letter-spacing:.16em;color:var(--sub)}
/* 오른쪽: 앨범 + 곡 목록 */
.mh .k{font:500 10px/1 var(--mono);letter-spacing:.2em;color:var(--sub)}
.mh h1{margin-top:16px;font:400 clamp(48px,6vw,92px)/1 var(--kr);color:#0E1834}
.mh p{margin-top:16px;max-width:460px;font-size:14px;line-height:1.75;color:#1B2A4A}
.tl{list-style:none;margin-top:36px;border-bottom:1px solid rgba(14,24,52,.14)}
.tl li{border-top:1px solid rgba(14,24,52,.14)}
.tl button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:44px 30px 1fr auto 34px;gap:12px;align-items:center;padding:16px 4px}
.tl button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tl .th{width:40px;height:40px;object-fit:contain}
.tl .n{font:500 10px/1 var(--mono);color:var(--sub)}
.tl .t{font:400 clamp(19px,1.8vw,24px)/1.2 var(--kr);color:#0E1834}
.tl .t.en{font:400 italic clamp(24px,2.2vw,30px)/1 var(--serif)}
.tl .t small{font:400 12px/1 var(--kr);color:var(--sub);margin-left:6px}
.tl .s{font:500 9px/1.4 var(--mono);letter-spacing:.12em;color:var(--sub);text-align:right}
.tl .pp{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:10px;border:1px solid rgba(14,24,52,.25);color:#0E1834}
.tl .more{display:none;padding:0 4px 18px 90px;font-size:13.5px;line-height:1.7;color:#1B2A4A}
.tl .more span{display:block;margin-top:8px;font:500 9px/1 var(--mono);letter-spacing:.14em;color:var(--sub)}
.tl li.sel .more{display:block}
.tl li.sel .t,.tl li.sel .n{color:var(--blue)}
.tl li.on .pp{background:var(--blue);border-color:var(--blue);color:#fff}
.note{margin-top:22px;font:500 9.5px/1.7 var(--mono);letter-spacing:.12em;color:var(--sub)}
.acts{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
.act{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:99px;background:#0E1834;color:#fff;font:500 11px/1 var(--mono);letter-spacing:.14em}
.act i{font:400 italic 15px/1 var(--serif);letter-spacing:0;opacity:.8}.act.ghost{background:transparent;color:#0E1834;box-shadow:inset 0 0 0 1px rgba(14,24,52,.3)}.act:hover{background:#174BFF;color:#fff}.act:focus-visible{outline:2px solid #174BFF;outline-offset:3px}
.tl li.prep button{cursor:default}.tl li.prep .t,.tl li.prep .th{opacity:.4}.tl li.prep .pp{border-style:dashed;opacity:.5}
.tl .badge{display:inline-block;margin-left:8px;padding:3px 7px;border-radius:99px;background:#174BFF;color:#fff;font:500 8.5px/1 var(--mono);letter-spacing:.14em;vertical-align:middle}
.tl li.bonus-h{border-top:0;padding:30px 4px 10px;font:500 10px/1 var(--mono);letter-spacing:.2em;color:var(--sub)}
@media (max-width:820px){
  .mu{grid-template-columns:1fr;padding-top:84px;gap:10px}
  .deck{position:relative;top:0;height:auto;min-height:0;padding:10px 0 34px}
  .case{width:min(70vw,320px)}
  .mh h1{font-size:44px}
  .tl button{grid-template-columns:36px 24px 1fr 30px}.tl .th{width:32px;height:32px}
  .tl .s{display:none}
  .tl .more{padding-left:70px}
}
@media (prefers-reduced-motion:reduce){.mu.playing .disc{animation:none}}
</style>
</head>
<body>
<main class="mu" id="mu">
  <div class="deck" aria-hidden="true">
    <div class="case"><span class="disc"></span><img id="caseImg" src="img/goods/01-clear-archive.webp" alt=""></div>
    <div class="cap"><span id="capL">CASE — CLEAR ARCHIVE</span><span>10 TRACKS + BONUS 2</span></div>
  </div>
  <div>
    <div class="mh"><span class="k">III · 음악 — GYEOLLAK · 정규 앨범</span><h1>장마의 잔향</h1>
      <p>곡을 고르면 케이스가 바뀌고, 재생하면 그 안의 CD가 돌아간다. 아래 플레이어는 다른 챕터로 넘어가도 계속 이어진다.</p>
      <div class="acts"><button type="button" class="act" id="playTitle">▶ 타이틀 듣기 <i>Rewind</i></button><button type="button" class="act ghost" id="playAll">처음부터 듣기</button></div></div>
    <ol class="tl" id="tl" aria-label="트랙 목록"></ol>
    <p class="note">음원은 듣기만 가능 · 정식 발매 전 검토용 · CD 케이스를 물건으로 자세히 보려면 <a href="objects.html" style="color:var(--blue)">IV 물건</a></p>
  </div>
</main>
<script src="js/player.js"></script>
<script>
(()=>{const T=GY_TRACKS,tl=document.getElementById('tl'),mu=document.getElementById('mu'),img=document.getElementById('caseImg');let sel=GYP.cur;
 const n2=i=>String(i+1).padStart(2,'0');
 T.forEach((x,i)=>{if(x.bonus&&!T[i-1].bonus){const h=document.createElement('li');h.className='bonus-h';h.textContent='BONUS · 또 다른 계절';tl.appendChild(h)}
  const li=document.createElement('li');li.id='t'+n2(i);const prep=!x.f;if(prep)li.classList.add('prep');
  li.innerHTML=`<button type="button" ${prep?'aria-disabled="true"':''} aria-label="${x.t} ${prep?(x.prep||'준비 중'):'고르고 재생'}"><img class="th" src="img/goods/${x.c}.webp" alt="" loading="lazy"><span class="n">${x.bonus?'B'+(i-T.findIndex(t=>t.bonus)+1):n2(i)}</span><span class="t${x.en?' en':''}">${x.t}${x.k?`<small>${x.k}</small>`:''}${x.title?'<span class="badge">TITLE</span>':''}</span><span class="s">${prep?(x.prep||'준비 중'):x.s}</span><span class="pp" aria-hidden="true">${prep?'·':'▶'}</span></button><div class="more">${x.p||'곡 소개 준비 중.'}<span>CASE — ${x.cn}</span></div>`;
  li.firstChild.onclick=()=>{if(prep){pick(i);return}if(sel===i&&GYP.cur===i){GYP.toggle();return}pick(i);GYP.play(i)};tl.appendChild(li)});
 document.getElementById('playTitle').onclick=()=>{const i=T.findIndex(t=>t.title);pick(i);GYP.play(i)};
 document.getElementById('playAll').onclick=()=>{const i=T.findIndex(t=>t.f);pick(i);GYP.play(i)};
 function pick(i){sel=i;[...tl.querySelectorAll('li[id]')].forEach((li,k)=>li.classList.toggle('sel',k===i));const src=`img/goods/${T[i].c}.webp`;
  if(!img.src.endsWith(src)){img.classList.add('sw');setTimeout(()=>{img.src=src;img.onload=()=>img.classList.remove('sw')},200)}
  document.getElementById('capL').textContent='CASE — '+T[i].cn}
 addEventListener('gy:player',e=>{const d=e.detail;if(d.i!==sel)pick(d.i);mu.classList.toggle('playing',d.on);[...tl.querySelectorAll('li[id]')].forEach((li,k)=>{const on=k===d.i&&d.on;li.classList.toggle('on',on);if(T[k].f)li.querySelector('.pp').textContent=on?'❚❚':'▶'})});
 const h=location.hash.match(/^#t(\d\d)$/);pick(h?Math.min(T.length-1,+h[1]-1):GYP.cur);
})();
</script>
<script src="js/toc.js" data-page="music" data-next="1"></script>
</body>
</html>
