<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>결락 GYEOLLAK — II 사람 · 멤버 선택 (레퍼런스 시안 v1)</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/ref.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body class="pg">
<header class="hd">
  <a class="brand" href="index.html"><b>결락</b><span>GYEOLLAK</span></a>
  <nav aria-label="사이트"><a href="index.html">I 결락</a><a class="on" href="people.html">II 사람</a><a class="x" href="../../../v15/music.html">III 음악</a></nav>
</header>
<div class="refbadge">REFERENCE MOCKUP v1 · II 사람</div>
<section class="sel" id="sel" aria-roledescription="carousel" aria-label="네 사람">
  <div class="bgno" id="bgno" aria-hidden="true">01</div>
  <div class="ttl"><span id="nA">01</span><h1 class="thin">People</h1><span>04</span></div>
  <p class="sub">II 사람 — 네 사람, 네 장면</p>
  <div class="nav"><button type="button" id="prev" aria-label="이전 멤버">←</button><div class="dots" id="dots"></div><button type="button" id="next" aria-label="다음 멤버">→</button></div>
  <svg class="thr" id="thr" aria-hidden="true"><path id="thp"/></svg>
  <div class="drop14" id="pdrop" aria-hidden="true"><svg viewBox="0 0 18 24"><defs><radialGradient id="dg3" cx="38%" cy="62%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#DCEFFB"/><stop offset="1" stop-color="#9FD8F5"/></radialGradient></defs><path d="M9 .8C9 .8 1.6 10.4 1.6 15.4a7.4 7.4 0 0 0 14.8 0C16.4 10.4 9 .8 9 .8Z" fill="url(#dg3)" stroke="#174BFF" stroke-width="1"/><ellipse cx="6.4" cy="15.2" rx="1.5" ry="2.4" fill="#fff" opacity=".9"/></svg></div>
  <div class="car" id="car"></div>
  <p class="tip">← → · 옆으로 밀기 · 가운데 사람을 누르면 프로필</p>
</section>
<script src="js/members-data.js"></script>
<script>
(() => {
const M = GY_M, V = GY_V15, RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let c = +(new URLSearchParams(location.search).get('i') || 0) % 4;
const car = document.getElementById('car');
car.innerHTML = M.map((m, i) => `<a class="it" data-i="${i}" href="profile.html?m=${m.id}"><img src="assets/cut/${m.id}_white.webp" alt="${m.kr}"><span class="nm">${m.no} · ${m.en}<b>${m.kr}</b><em>프로필 보기 →</em></span></a>`).join('');
document.getElementById('dots').innerHTML = M.map(() => '<i></i>').join('');
const its = [...car.children], dots = [...document.querySelectorAll('#dots i')];
function lay() {
  const vw = innerWidth, vh = innerHeight, mob = vw < 760;
  its.forEach((el, i) => {
    let d = (i - c + 4) % 4; if (d === 3) d = -1;
    const m = M[i], img = el.querySelector('img');
    const H = (d === 0 ? (mob ? .5 : .56) : (mob ? .2 : .27)) * vh * m.cm / 195;
    img.style.height = H + 'px';
    const off = d === 0 ? 0 : d * (mob ? 36 : 27) * vw / 100;
    el.style.transform = `translateX(calc(-50% + ${off}px))`;
    el.classList.toggle('c', d === 0); el.classList.toggle('h', d === 2);
    el.style.opacity = d === 0 ? 1 : d === 2 ? 0 : .78;
    el.style.zIndex = d === 0 ? 3 : 1;
    el.setAttribute('aria-hidden', d === 2); el.tabIndex = d === 2 ? -1 : 0;
    const nm = el.querySelector('em'); nm.style.display = d === 0 ? 'block' : 'none';
  });
  dots.forEach((x, i) => x.classList.toggle('on', i === c));
  document.getElementById('nA').textContent = M[c].no;
  const bg = document.getElementById('bgno'); bg.textContent = M[c].no; bg.style.transform = 'translate(-50%,-50%)';
  // 실: 화면 위에서 가운데 사람 머리 위 물방울까지
  const ce = its[c], r = ce.querySelector('img').getBoundingClientRect();
  const H = (mob ? .5 : .56) * vh * M[c].cm / 195, bottom = vh - (mob ? .12 : .13) * vh - 38;
  const hx = vw / 2, hy = r.top - 8;
  const p = document.getElementById('thp');
  p.setAttribute('d', `M${vw * .5 - 40} 0 C ${vw * .5 - 60} ${hy * .4}, ${hx + 40} ${hy * .7}, ${hx} ${hy}`);
  const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.transition = 'none'; p.style.strokeDashoffset = RM ? 0 : L;
  requestAnimationFrame(() => requestAnimationFrame(() => { p.style.transition = 'stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)'; p.style.strokeDashoffset = 0; }));
  const dr = document.getElementById('pdrop'); dr.style.left = hx + 'px'; dr.style.top = hy + 'px';
}
const go = n => { c = (n + 4) % 4; lay(); };
document.getElementById('prev').onclick = () => go(c - 1);
document.getElementById('next').onclick = () => go(c + 1);
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(c - 1); if (e.key === 'ArrowRight') go(c + 1); });
its.forEach((el, i) => el.addEventListener('click', e => { if (moved) { e.preventDefault(); return; } if (i !== c) { e.preventDefault(); go(i); } }));
let sx = null, moved = false;
car.addEventListener('pointerdown', e => { sx = e.clientX; moved = false; });
car.addEventListener('pointermove', e => { if (sx != null && Math.abs(e.clientX - sx) > 10) moved = true; });
car.addEventListener('pointerup', e => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 50) go(c + (dx < 0 ? 1 : -1)); setTimeout(() => moved = false, 0); });
addEventListener('resize', lay); lay();
})();
</script>
</body>
</html>
